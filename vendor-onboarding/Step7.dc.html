<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  </style>
</helmet>

<div style="width:794px; height:1123px; background:#F7F5F3; color:#0E0E0E; display:flex; flex-direction:column;">

  <div style="padding:56px 64px 0 64px; display:flex; flex-direction:column;">
    <div style="width:52px; height:52px; border-radius:9999px; background:#FF521B; color:#FFFFFF; font-size:22px; font-weight:800; display:flex; align-items:center; justify-content:center;">7</div>
    <div style="font-size:32px; font-weight:800; letter-spacing:-0.5px; margin-top:20px; line-height:1.15;">Add your first menu item</div>
    <div style="font-size:15.5px; font-weight:500; color:#4a4642; margin-top:10px; max-width:52ch; line-height:1.6;">Add a photo, a name and a price for one item so customers have something to order. You can add more items any time later.</div>
  </div>

  <div style="flex-grow:1; display:flex; align-items:center; justify-content:center; position:relative; padding-top:10px;">

    <div style="width:320px; height:620px; background:#0E0E0E; border-radius:36px; padding:12px; box-shadow:0 24px 60px rgba(14,14,14,0.18);">
      <div style="width:100%; height:100%; background:#FFFFFF; border-radius:26px; overflow:hidden; display:flex; flex-direction:column; padding:32px 20px 20px;">

        <div style="font-size:20px; font-weight:800;">New menu item</div>
        <div style="font-size:12.5px; font-weight:500; color:#8b8782; margin-top:4px;">Item 1 of your menu</div>

        <div style="border:1.5px solid #E8E5E2; border-radius:4px; padding:16px; margin-top:20px; display:flex; flex-direction:column; gap:12px;">
          <div style="height:90px; border-radius:4px; background:repeating-linear-gradient(45deg, #E8E5E2, #E8E5E2 8px, #F2F0EE 8px, #F2F0EE 16px); display:flex; align-items:center; justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8b8782" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
          </div>
          <div style="display:flex; flex-direction:column; gap:5px;">
            <div style="font-size:11px; font-weight:700; color:#8b8782; text-transform:uppercase; letter-spacing:0.4px;">Item name</div>
            <div style="border:1.5px solid #E8E5E2; border-radius:4px; padding:10px 11px; font-size:13.5px; font-weight:600;">Jollof Rice &amp; Chicken</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:5px;">
            <div style="font-size:11px; font-weight:700; color:#8b8782; text-transform:uppercase; letter-spacing:0.4px;">Price</div>
            <div style="border:1.5px solid #E8E5E2; border-radius:4px; padding:10px 11px; font-size:13.5px; font-weight:600;">₦2,500</div>
          </div>
        </div>

        <div style="flex-grow:1;"></div>
        <div style="background:#FF521B; color:#FFFFFF; font-size:14.5px; font-weight:800; text-align:center; padding:14px; border-radius:4px;">Save Item</div>

      </div>
    </div>

    <div style="position:absolute; right:104px; top:200px; display:flex; flex-direction:row; align-items:center; gap:10px;">
      <svg width="66" height="34" viewBox="0 0 66 34" fill="none">
        <path d="M60 4 C 40 4, 22 8, 10 22" stroke="#FF521B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M10 22 L19 21 M10 22 L13 30" stroke="#FF521B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div style="background:#0E0E0E; color:#FFFFFF; font-size:12px; font-weight:700; padding:8px 12px; border-radius:4px; white-space:nowrap;">Add a photo</div>
    </div>

  </div>

  <div style="background:#FFFFFF; border-top:1px solid #E8E5E2; padding:20px 64px; display:flex; flex-direction:row; align-items:center; justify-content:space-between;">
    <div style="display:flex; flex-direction:row; gap:7px;">
      <div style="width:8px; height:8px; border-radius:9999px; background:#E8E5E2;"></div>
      <div style="width:8px; height:8px; border-radius:9999px; background:#E8E5E2;"></div>
      <div style="width:8px; height:8px; border-radius:9999px; background:#E8E5E2;"></div>
      <div style="width:8px; height:8px; border-radius:9999px; background:#E8E5E2;"></div>
      <div style="width:8px; height:8px; border-radius:9999px; background:#E8E5E2;"></div>
      <div style="width:8px; height:8px; border-radius:9999px; background:#E8E5E2;"></div>
      <div style="width:8px; height:8px; border-radius:9999px; background:#FF521B;"></div>
      <div style="width:8px; height:8px; border-radius:9999px; background:#E8E5E2;"></div>
    </div>
    <div style="font-size:12.5px; font-weight:600; color:#8b8782;">Step 7 of 8</div>
  </div>

</div>
</x-dc>
