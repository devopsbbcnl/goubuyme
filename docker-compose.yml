# Local development only — this does NOT describe how the app is deployed to
# the production VPS (that stays on PM2, see backend/ecosystem.config.js).
# Run everything:      docker compose up
# Run in background:   docker compose up -d
# Stop everything:     docker compose down
# Stop AND wipe data:  docker compose down -v   (only if you want a clean DB)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gobuyme_db
    ports:
      # HOST:CONTAINER — lets you still connect with a local tool (e.g.
      # Prisma Studio, TablePlus, psql) at localhost:5432 if you want to.
      - "5432:5432"
    volumes:
      # Named volume — Docker manages where this actually lives on disk.
      # Without this, `docker compose down` would delete all your data.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      # Reuses all your existing secrets (Paystack, Cloudinary, Resend, JWT)
      # from the .env you already have — nothing to duplicate.
      - ./backend/.env
    environment:
      # These two override whatever is in backend/.env, because inside
      # Docker's network "localhost" means "this container," not your
      # machine — the backend must reach Postgres/Redis by service name.
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/gobuyme_db?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  admin:
    build:
      context: ./gobuyme-admin-nextjs
    restart: unless-stopped
    ports:
      # Matches the convention baked into backend/.env's ADMIN_URL and the
      # CORS allowlist in backend/src/server.ts — must stay 3000 on the host.
      - "3000:3000"
    env_file:
      - ./gobuyme-admin-nextjs/.env.local
    environment:
      # Overrides .env.local's localhost default so the container's own
      # server-side API routes (app/api/proxy, app/api/auth/*) reach the
      # backend over the compose network by service name, not by bouncing
      # out to the host and back in. NEXT_PUBLIC_* values are unaffected —
      # those were already baked into the client bundle at image build time.
      BACKEND_API_URL: http://backend:5000/api/v1
    depends_on:
      - backend

  web:
    build:
      context: ./gobuyme-web
    restart: unless-stopped
    ports:
      # Matches backend/.env's CLIENT_URL — must stay 3001 on the host.
      - "3001:3000"
    env_file:
      - ./gobuyme-web/.env.local
    environment:
      BACKEND_API_URL: http://backend:5000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
